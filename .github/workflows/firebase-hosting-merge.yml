name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: firebase-hosting-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Auth Google (Firebase)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUELSDECAVE }}

      - name: Deploy Cloud Functions
        run: |
          npm i -g firebase-tools
          firebase deploy --only functions --project duelsdecave

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: duelsdecave

      - name: Ensure public invoker on all callable Cloud Run services
        run: |
          set -e
          SERVICES="dungeon_getProgress dungeon_startRun dungeon_endRun dungeon_setEquippedWeapon dungeon_markCompleted dungeon_grantRuns bossRush_claimReward betting_placeBet betting_cancelBet"
          for SVC in $SERVICES; do
            # Cloud Run lowercases service names derived from function names.
            SVC_LC=$(echo "$SVC" | tr '[:upper:]' '[:lower:]')
            echo "=== IAM binding allUsers/roles/run.invoker for $SVC_LC (region europe-west1) ==="
            gcloud run services add-iam-policy-binding "$SVC_LC" \
              --region=europe-west1 \
              --project=duelsdecave \
              --member="allUsers" \
              --role="roles/run.invoker" || echo "WARN: failed to patch IAM for $SVC_LC"
          done

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUELSDECAVE }}
          channelId: live
          projectId: duelsdecave
